appId: com.xxl.ai.desk
productName: XXL-AI Desk
directories:
  buildResources: build
  output: release/${version}
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,package-lock.json}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # 排除构建产物与输出目录（否则 release 会被递归打包进 asar）
  - '!release/**'
  - '!build/**'
  - '!dist/**'
  - '!*.log'
  - '!**/*.{log,tmp,tsbuildinfo}'
  # 精简打包：剔除依赖内的文档 / 源码映射 / 测试与示例，压缩体积
  - '!**/*.{md,markdown,map}'
  - '!**/{test,tests,__tests__,example,examples,spec,specs,benchmark,benchmarks}/**'
  - '!**/{LICENSE,LICENCE,LICENSE.txt,LICENSE.md,CHANGELOG.md,README.md,.editorconfig,.eslintrc,.eslintrc.js,.eslintrc.cjs,.prettierrc,.prettierrc.yaml,.npmignore,.gitignore,.travis.yml,tsconfig.json}'
# 最大压缩（dmg/AppImage 等安装包更小，代价是打包耗时略增）
compression: maximum
asarUnpack:
  - resources/**
win:
  target:
    - nsis
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: xuxueli
npmRebuild: true
# 中国大陆网络无法直连 GitHub 下载 Electron 产物，统一走 npmmirror 镜像
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
