# XXL-AI Desk 打包配置：Electron Builder 产物定义（win/mac/linux 安装包、asar 与原生依赖重编译）
# 应用标识与展示名
appId: com.xxl.ai.desk
productName: XXL-AI Desk
directories:
  buildResources: build
  output: release/${version}          # 安装包输出目录（按版本分目录）
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,package-lock.json}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # 排除构建产物与输出目录（否则 release 会被递归打包进 asar）
  - '!release/**'
  - '!build/**'
  - '!dist/**'
  - '!*.log'
  - '!**/*.{log,tmp,tsbuildinfo}'
  # 精简打包：剔除依赖内的文档 / 源码映射 / 测试与示例，压缩体积
  - '!**/*.{md,markdown,map}'
  - '!**/{test,tests,__tests__,example,examples,spec,specs,benchmark,benchmarks}/**'
  - '!**/{LICENSE,LICENCE,LICENSE.txt,LICENSE.md,CHANGELOG.md,README.md,.editorconfig,.eslintrc,.eslintrc.js,.eslintrc.cjs,.prettierrc,.prettierrc.yaml,.npmignore,.gitignore,.travis.yml,tsconfig.json}'
# 最大压缩（dmg/AppImage 等安装包更小，代价是打包耗时略增）
compression: maximum
# 需解压到 asar 外的资源（原生模块等无法从 asar 内加载）
asarUnpack:
  - resources/**
# Windows 安装包（NSIS）
win:
  target:
    - nsis
# macOS 安装包（dmg + zip，zip 用于自动更新）
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-${arch}.${ext}
# Linux 安装包（AppImage + deb）
linux:
  target:
    - AppImage
    - deb
  category: Utility
  maintainer: xuxueli
# 安装时针对 Electron 版本重新编译原生依赖（better-sqlite3 / node-pty）
npmRebuild: true

