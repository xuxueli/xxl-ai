# docker-compose version
version: '3.8'

services:

  # ==================== 核心存储 ====================

  mysql:
    image: mysql:8.4
    container_name: xxl-ai-mysql
    environment:
      # 1、数据库密码设置，需要与系统中配置一致：
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # 2、数据库实例名称，需要与系统中配置一致；
      MYSQL_DATABASE: xxl_ai
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      # 说明：仅数据库首次初始化时执行；
      - ../../doc/db/tables_xxl_ai.sql:/docker-entrypoint-initdb.d/tables_xxl_ai.sql:ro
      # 3、数据库持久化目录位置，建议自定义：
      - ${MYSQL_PATH}/conf:/etc/mysql/conf.d
      - ${MYSQL_PATH}/logs:/var/log/mysql
      - ${MYSQL_PATH}/data:/var/lib/mysql
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - xxl-ai-network

  redis:
    image: redis:7.4
    container_name: xxl-ai-redis
    environment:
      # 4、Redis访问密码，需要与上文 xxl-ai-api 中配置保持一致（默认空密码，如设置请同步配置 REDIS_PASSWORD）；
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      # 5、Redis持久化目录位置，建议自定义：
      - ${REDIS_PATH}/data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -z \"$$REDIS_PASSWORD\" ]; then redis-cli ping; else redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping; fi"]
      timeout: 20s
      retries: 10
    networks:
      - xxl-ai-network

  # ==================== 向量数据库（Milvus 单机版：etcd + minio + milvus） ====================
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: xxl-ai-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${MILVUS_PATH}/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - xxl-ai-network

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: xxl-ai-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ${MILVUS_PATH}/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    networks:
      - xxl-ai-network

  milvus:
    image: milvusdb/milvus:v2.6.23
    container_name: xxl-ai-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
      MINIO_BUCKET_NAME: milvus
    volumes:
      - ${MILVUS_PATH}/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    networks:
      - xxl-ai-network

  attu:
    image: zilliz/attu:v2.6
    container_name: xxl-ai-attu
    ports:
      - "3030:3000"
    environment:
      MILVUS_URL: milvus:19530
    depends_on:
      - milvus
    networks:
      - xxl-ai-network

  # ==================== API 服务 ====================

  xxl-ai-api:
    # 6、本地Build设置
    image: xuxueli/xxl-ai-api:local
    build:
      context: ../../xxl-ai-api
      dockerfile: Dockerfile
    container_name: xxl-ai-api
    environment:
      # 7、数据库密码设置，需要与上文Mysql中保持一致：
      PARAMS: >-
        --server.port=${XXL_AI_API_PORT}
        --server.servlet.context-path=${XXL_AI_API_CONTEXT_PATH}
        --spring.datasource.url=jdbc:mysql://mysql:3306/xxl_ai?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=root 
        --spring.datasource.password=${MYSQL_ROOT_PASSWORD}
        --spring.data.redis.host=redis
        --spring.data.redis.port=6379
        --spring.data.redis.password=${REDIS_PASSWORD}
        --xxl-ai.milvus.uri=http://milvus:19530
    ports:
      - "${XXL_AI_API_PORT}:${XXL_AI_API_PORT}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xxl-ai-network

  xxl-ai-ui-vue:
    # 8、本地Build设置
    image: xuxueli/xxl-ai-ui-vue:local
    build:
      context: ../../xxl-ai-ui
      dockerfile: Dockerfile
      # 附加构建上下文：用于 COPY 目录下的 nginx 配置
      additional_contexts:
        nginx: ./
    container_name: xxl-ai-ui-vue
    ports:
      - "${XXL_AI_UI_PORT}:80"
    depends_on:
      - xxl-ai-api
    networks:
      - xxl-ai-network

networks:
  xxl-ai-network:
    driver: bridge
