### web
server.port=8091
server.servlet.context-path=/

### resources
spring.mvc.servlet.load-on-startup=0
spring.mvc.static-path-pattern=/static/**

### xxl-ai-sample, spring-ai MCP Server（注解式 @McpTool，Streamable HTTP）
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.server.type=sync
spring.ai.mcp.server.name=xxl-ai-sample
spring.ai.mcp.server.version=1.0.1-SNAPSHOT
spring.ai.mcp.server.instructions=Built-in sample MCP service (Streamable HTTP) for XXL-AI: get_current_time / calculator tools.
spring.ai.mcp.server.streamable-http.mcp-endpoint=/sample/mcp