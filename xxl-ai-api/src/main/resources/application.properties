### web
server.port=8080
server.servlet.context-path=/

### web config: actuator、error page、controller-format
management.server.base-path=/actuator
spring.web.error.whitelabel.enabled=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

### resources（前端产物内嵌：/** 提供 dist 静态资源与 index.html，Controller 优先匹配）
spring.mvc.servlet.load-on-startup=0
spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/

### file upload
spring.servlet.file.resource-prefix=/profile
spring.servlet.file.profile=./upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

### freemarker
spring.freemarker.templateLoaderPath=classpath:/templates/
spring.freemarker.suffix=.ftl
spring.freemarker.charset=UTF-8
spring.freemarker.request-context-attribute=request
spring.freemarker.settings.number_format=0.##########
spring.freemarker.settings.new_builtin_class_resolver=safer

### mybatis
mybatis.mapper-locations=classpath:/mapper/**/*Mapper.xml

### datasource-pool
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=HikariCP
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=1000

### xxl-ai, datasource
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/xxl_ai?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root_pwd
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

### xxl-ai, redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.password=
spring.data.redis.timeout=10000ms
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-idle=16
spring.data.redis.lettuce.pool.max-active=32
spring.data.redis.lettuce.pool.max-wait=10000ms

### xxl-ai, spring-ai (模型运行时由 LLM 模型工厂按供应商配置程序化构建，禁用默认自动装配)
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

### xxl-ai, milvus (向量数据库)
xxl-ai.milvus.uri=http://127.0.0.1:19530
xxl-ai.milvus.username=
xxl-ai.milvus.password=
xxl-ai.milvus.database=default

### xxl-ai, chat stream (SSE 无状态化：Redis Stream 任务队列 + 结果流 + 断线续传)
### stream.timeout：单次生成 / 单 SSE 连接最长时长(ms)
xxl-ai.chat.stream.timeout=180000
### stream.ttl：结果流保留时长(s)，决定断线/刷新后可续传的时间窗，按业务容忍度配置
xxl-ai.chat.stream.ttl=600
### worker.count：单节点 SSE 转发工作线程数（不可低于redis线程数，否则线程竞争造成卡顿）
xxl-ai.chat.worker.count=4
### sse.max：单节点 SSE 最大并发连接数，超过该值将拒绝新连接（可通过 Nginx 等反向代理做负载均衡）
xxl-ai.chat.sse.max=64
### history.limit：附加给模型的最近历史消息条数上限（按消息数截断，控制上下文长度）
xxl-ai.chat.history.limit=50

### xxl-ai, skill (技能根目录, 集群建议挂载共享持久卷)
xxl-ai.skill.root=/data/applogs/xxl-ai/skills/

### xxl-sso
xxl-sso.token.key=xxl-sso-login-token
xxl-sso.token.timeout=604800000
xxl-sso.store.redis.keyprefix=xxl_sso_user:
xxl-sso.client.excluded.paths=/profile/**
